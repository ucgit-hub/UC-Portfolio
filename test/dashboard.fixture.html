<!-- FIXTURE: anchor-bearing regions copied verbatim from the deployed
     uc-portfolio bundle (dashboard.html). CSS omitted — contains no anchors. -->
<div class="topbar"><div class="topbar-brand">UC-Portfolio <span>Momentum System</span></div><div class="topbar-metrics" id="topbar-metrics"><div>Regime: <span class="val" id="tb-regime">—</span></div><div>VIX: <span class="val" id="tb-vix">—</span></div><div>Brent: <span class="val" id="tb-brent">—</span></div><div>Nifty: <span class="val" id="tb-nifty">—</span></div><div>Freeze: <span class="val" id="tb-freeze">—</span></div><div id="tb-updated" style="color:var(--text3)"></div></div></div>
<div class="card" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Stock</th><th class="hm">Sector</th><th>Entry</th><th>LTP</th><th>P&L</th><th>Value</th><th class="hm">Stage</th><th>GTT Gap</th></tr></thead><tbody id="holdings-body"></tbody></table></div>
<div class="section-title">🔄 Rotation Signals</div><div class="card" id="rotation-container"></div>
<script>
function renderAll(){if(!D)return;const m=D.macro||{};document.getElementById('tb-regime').textContent=m.regime||'—';document.getElementById('tb-vix').textContent=m.vix||'—';document.getElementById('tb-vix').className='val '+(m.vix>18?'neg':m.vix<15?'pos':'');document.getElementById('tb-brent').textContent=m.brent?'$'+m.brent:'—';document.getElementById('tb-brent').className='val '+(m.brent>90?'neg':'pos');document.getElementById('tb-nifty').textContent=m.nifty?m.nifty.toLocaleString():'—';document.getElementById('tb-freeze').textContent=m.freeze?'ON':'OFF';document.getElementById('tb-freeze').className='val '+(m.freeze?'neg':'pos');document.getElementById('tb-updated').textContent=m.updatedAt?'Updated: '+new Date(m.updatedAt).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
document.getElementById('hero').innerHTML=`<div class="card-title">Net Worth</div><div class="hero-amount">${fmt(D.netWorth)}</div><div class="hero-sub">Baseline TEST · Since TEST</div>`;
document.getElementById('holdings-body').innerHTML=sorted.map(s=>{return`<tr><td class="sym">${s.symbol}</td><td class="hm" style="font-size:11px;color:var(--text2)">${s.gtt_stage||''}</td><td><span style="color:${gc};font-weight:600">${s.gtt_gap_pct?.toFixed(1)||'—'}%</span></td></tr>`}).join('');}
function renderOpportunities(){const rot=D.rotations||[];document.getElementById('rotation-container').innerHTML=rot.length?rot.map(r=>`<div class="rotation-row"><span style="color:var(--red);font-weight:600">🔴 ${r.exit} (${(r.exitScore||0).toFixed(2)})</span><span style="font-size:18px">→</span><span style="color:var(--green);font-weight:600">🟢 ${r.enter} (${(r.enterScore||0).toFixed(2)})</span><span class="tag" style="background:var(--green-bg);color:var(--green)">+${r.gap?.toFixed(2)} ⚡ ROTATE</span></div>`).join(''):'<div style="padding:12px;font-size:13px;color:var(--text3)">No rotation signals. All holdings performing adequately.</div>';}
</script>
