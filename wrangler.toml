name = "uc-portfolio"
main = "src/queue-worker.js"
compatibility_date = "2024-09-25"

[triggers]
crons = ["45 10 * * 1-5"]  # 10:45 UTC = 4:15 PM IST, weekdays only

[[d1_databases]]
binding = "DB"
database_name = "uc-portfolio-db"
database_id = "82c725e5-14cd-4d13-82d5-2ec049319695"

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "uc-momentum-scan"

[[queues.consumers]]
queue = "uc-momentum-scan"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 4
dead_letter_queue = "uc-momentum-scan-dlq"
max_concurrency = 1
retry_delay = 30

[[queues.consumers]]
queue = "uc-momentum-scan-dlq"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 1
